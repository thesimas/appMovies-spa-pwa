<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePWA - Catálogo de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="imagens/pipoca.png" type="image/x-icon">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="nav-link active " style="cursor: pointer;" id="inicio" onclick="lancamentos()">Início</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" style="cursor: pointer;" id="lancamento"
                            onclick="lancamentos()">Lançamentos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" style="cursor: pointer;" id="filmesPopulares"
                            onclick="listarFilmesPopulares()">Filmes Populares</a>
                    </li>
                    <li class="nav-item ms-2 mt-1">
                        <select class="form-select form-select-sm" aria-label="Default select example"
                            id="select-categorias" style="cursor: pointer;"
                            onchange="listarFilmesPorCategorias(this.value)">
                            <option value="" selected disabled>Filtrar Por Categoria</option>
                        </select>
                    </li>
                    <li id="installAppBt" class="nav-item collapse">
                        <a class="nav-link" onclick="installApp()" style="cursor: pointer;" data-toggle="collapse"
                            data-target="#menuNavbar">Instalar APP</a>
                    </li>
                </ul>
                <form class="d-flex" role="search" id="formulario">
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search"
                        id="busca" />
                    <button class="btn btn-outline-success" type="submit" id="bt-busca">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <!--Tela dos filmes-->
    <div id="tela-principal" class="tela show row row-cols-sm-1 row-cols-md-4 g-4"></div>
    <div id="tela-detalhes" class="tela collapse row g-4"></div>

    <script src="env.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
